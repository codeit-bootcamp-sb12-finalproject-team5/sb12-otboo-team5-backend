spring:
  application:
    name: notification-worker

  config:
    import: optional:dotenv:../

  main:
    web-application-type: none

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  flyway:
    enabled: false

  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none
notification:
  kafka:
    enabled: ${NOTIFICATION_KAFKA_ENABLED:false}
