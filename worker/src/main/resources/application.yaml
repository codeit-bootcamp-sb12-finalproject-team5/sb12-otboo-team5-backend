spring:
  application:
    name: notification-worker

  config:
    import: optional:dotenv:../

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  flyway:
    enabled: false

  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none
notification:
  kafka:
    enabled: ${NOTIFICATION_KAFKA_ENABLED:false}

server:
  port: ${SERVER_PORT:-1}

management:
  server:
    port: ${MANAGEMENT_PORT:9103}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
