spring:
  application:
    name: notification-worker

  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: false

  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none

server:
  port: ${SERVER_PORT:-1}

management:
  server:
    port: ${MANAGEMENT_PORT:9103}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
