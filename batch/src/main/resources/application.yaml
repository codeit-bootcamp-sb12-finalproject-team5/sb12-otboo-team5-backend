spring:
  application:
    name: batch
  main:
    web-application-type: none
    keep-alive: true
  config:
    import: optional:dotenv:../

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:otboo}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:secret}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:unused-in-batch}

kma:
  service-key: ${KMA_API_KEY:}

weather:
  cache:
    ttl: PT3H
