spring:
  application:
    name: batch
  main:
    web-application-type: servlet
    keep-alive: true
  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: true
      name: dailyWeatherSyncJob

  data:
    redis:
      timeout: 300ms
      connect-timeout: 200ms

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:unused-in-batch}

kma:
  service-key: ${KMA_API_KEY:}

weather:
  cache:
    ttl: PT3H

server:
  # 외부에 제공하는 API가 없다. -1은 일반 웹 서버를 띄우지 않는다는 뜻이다.
  port: ${SERVER_PORT:-1}

management:
  server:
    port: ${MANAGEMENT_PORT:9104}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
