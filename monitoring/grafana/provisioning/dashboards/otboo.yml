apiVersion: 1

# /etc/grafana/dashboards의 JSON 파일을 OTBOO 폴더의 대시보드로 불러온다.
# 화면에서 수정할 수는 있지만, 남기려면 JSON으로 내보내 파일에 덮어써야 한다.
providers:
  - name: otboo
    folder: OTBOO
    type: file
    disableDeletion: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
