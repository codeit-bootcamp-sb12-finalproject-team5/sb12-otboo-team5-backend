global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 관리 포트 규칙: api 9101/9102, worker 9103, batch 9104
# lab 스택(lab/docker-compose.yml)은 Prometheus와 같은 네트워크에 있으므로 컨테이너 이름으로 바로 붙는다.
scrape_configs:
  - job_name: otboo-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "otboo-lab-api-1:9101"
          - "otboo-lab-api-2:9102"

  - job_name: otboo-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["otboo-lab-worker:9103"]

  - job_name: otboo-batch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["otboo-lab-batch:9104"]

  # 컨테이너 대신 호스트에서 ./gradlew bootRun으로 띄울 때는 위 targets 대신 아래를 쓴다.
  # 켜둔 채로 앱을 안 띄우면 타깃이 계속 DOWN으로 남아 경보가 무뎌지므로, 쓸 때만 주석을 푼다.
  # - job_name: otboo-api-local
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ["host.docker.internal:9101"]
  # - job_name: otboo-batch-local
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ["host.docker.internal:9104"]
