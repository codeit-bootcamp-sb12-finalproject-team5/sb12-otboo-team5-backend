spring:
  application:
    name: api
  config:
    import: optional:dotenv:../

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5-mini

gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 1800
  refresh-token-validity-seconds: 1209600

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

kma:
  service-key: ${KMA_API_KEY:}

weather:
  cache:
    ttl: PT3H

admin:
  email: ${ADMIN_EMAIL:system@otboo.io}
  password: ${ADMIN_PASSWORD:otboo1!}
  name: ${ADMIN_NAME:system}

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
      clothes-prefix: otboo-clothes-dev
      profile-prefix: otboo-profile-dev
    region: ${AWS_REGION}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}

notification:
  kafka:
    enabled: ${NOTIFICATION_KAFKA_ENABLED:false}
