events {}

http {
    upstream otboo_api {
        server api-1:8080;
        server api-2:8081;
    }

    log_format upstream '$remote_addr "$request" $status -> $upstream_addr (${upstream_response_time}s)';
    access_log /dev/stdout upstream;

    server {
        listen 8080;

        location /api/sse {
            proxy_pass http://otboo_api;
            proxy_http_version 1.1;
            proxy_read_timeout 15m;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            include /etc/nginx/otboo/forwarded.conf;
        }

        location /ws {
            proxy_pass http://otboo_api;
            proxy_http_version 1.1;
            proxy_read_timeout 15m;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            include /etc/nginx/otboo/forwarded.conf;
        }

        location / {
            proxy_pass http://otboo_api;
            proxy_http_version 1.1;
            include /etc/nginx/otboo/forwarded.conf;
        }
    }
}
