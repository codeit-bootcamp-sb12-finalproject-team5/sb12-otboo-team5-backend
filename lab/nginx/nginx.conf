events {}

http {
    # 배포에서 ALB가 하는 일을 대신한다. 프론트는 이 한 곳만 보고, 뒤에 API가 몇 대인지 모른다.
    upstream otboo_api {
        # 응답 대기 중인 연결이 가장 적은 쪽으로 보낸다. SSE처럼 오래 붙어 있는 연결이 섞여 있을 때
        # 단순 순번(round robin)보다 한쪽으로 쏠리지 않는다.
        least_conn;
        server api-1:8080;
        server api-2:8081;
    }

    # 어느 인스턴스가 처리했는지 로그로 남긴다. 분산이 실제로 되는지 눈으로 확인하는 용도다.
    log_format upstream '$remote_addr "$request" $status -> $upstream_addr (${upstream_response_time}s)';
    access_log /dev/stdout upstream;

    server {
        listen 8080;

        # SSE. 응답을 모아뒀다 보내면 이벤트가 실시간으로 안 나간다.
        location /api/sse {
            proxy_pass http://otboo_api;
            proxy_http_version 1.1;
            # 기본값이 60초다. 하트비트 간격이 이보다 길면 조용한 연결이 그대로 끊긴다.
            # 지금 하트비트가 10분(테스트용)이라 넉넉히 준다. ALB 유휴 타임아웃도 같은 문제를 겪는다.
            proxy_read_timeout 15m;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            include /etc/nginx/conf.d/forwarded.conf;
        }

        location /ws {
            proxy_pass http://otboo_api;
            proxy_http_version 1.1;
            proxy_read_timeout 15m;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            include /etc/nginx/conf.d/forwarded.conf;
        }

        location / {
            proxy_pass http://otboo_api;
            proxy_http_version 1.1;
            include /etc/nginx/conf.d/forwarded.conf;
        }
    }
}
